# =====================================================================
#  Barangay Labangon Document Request System - backend settings
#  Every ${NAME:default} value can be overridden with an environment
#  variable, so passwords never have to be committed to GitHub.
# =====================================================================

spring.application.name=brgy-labangon-docrequest
server.port=8080

# ---- MySQL (defaults match a fresh XAMPP install: user root, no password) ----
# createDatabaseIfNotExist=true makes MySQL create the brgy_labangon database on first run.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/brgy_labangon?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# "update" creates and updates the tables from the @Entity classes automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.time-zone=Asia/Manila

# ---- Login tokens (JWT) ----
# Use a long random value in production (at least 32 characters).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-brgy-labangon-2026-xyz}
app.jwt.expiration-hours=12

# ---- Which websites may call this API (React dev server by default) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Email for "Forgot password" ----
# Leave MAIL_HOST empty for class demos: the reset link is printed in the backend console instead.
# Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=your Gmail, MAIL_PASSWORD=a 16-letter Google "App password".
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Address of the React app, used to build the link inside the email.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.minutes=30

# ---- First staff account, created automatically if the staff table is empty ----
app.seed.staff-name=${STAFF_NAME:Barangay Secretary}
app.seed.staff-email=${STAFF_EMAIL:staff@labangon.local}
app.seed.staff-password=${STAFF_PASSWORD:ChangeMe123!}

# ---- Demo mode (for class presentations) ----
# true  = pages work WITHOUT logging in: calls to /api/resident/** act as the demo resident and
#         /api/staff/** act as the first staff account, and sample data is added to an empty database.
# false = normal login required. ALWAYS set DEMO_MODE=false before real residents use the system.
app.demo-mode=${DEMO_MODE:true}
